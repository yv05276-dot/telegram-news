<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>מבזק טלגרם</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--bg:light-dark(#f4f8fb,#07131c);--card:light-dark(#fff,#0e2130);--ink:light-dark(#0b1b26,#e8f1f7);--mute:light-dark(#5a6d7a,#8fa6b6);--blue:#1b8fd2;--deep:light-dark(#0b4f7a,#0a3552);--red:#e5262f;--line:light-dark(#dbe5ec,#1b3244)}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Rubik,system-ui,sans-serif}
header{background:var(--deep);color:#fff;padding:18px max(4vw,14px) 14px}
.top{max-width:760px;margin:auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:clamp(24px,6vw,34px);font-weight:800;line-height:1.1}
.live{display:inline-flex;align-items:center;gap:6px;background:var(--red);font-weight:700;font-size:13px;padding:3px 10px;border-radius:4px}
.live i{width:8px;height:8px;border-radius:50%;background:#fff;animation:p 1.4s infinite}
@keyframes p{50%{opacity:.25}}
.upd{max-width:760px;margin:6px auto 0;font-size:13px;opacity:.85}
main{max-width:760px;margin:auto;padding:0 max(3vw,10px) 40px}
.tools{position:sticky;top:0;z-index:2;background:var(--bg);padding:10px 0;display:grid;gap:8px}
input{width:100%;min-height:46px;font:inherit;font-size:16px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:0 14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.chip{flex:none;min-height:38px;padding:0 13px;border-radius:19px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:14px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#fff}
ol{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.post{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.hd{display:flex;justify-content:space-between;gap:8px;font-size:14px;margin-bottom:4px}
.ch{font-weight:700;color:var(--blue)}
time{color:var(--mute);white-space:nowrap}
.tx{white-space:pre-line;overflow-wrap:anywhere}
.md{color:var(--mute);font-style:italic}
.post a.go{display:inline-block;margin-top:6px;font-size:14px;color:var(--blue);text-decoration:none;font-weight:500}
.empty{text-align:center;color:var(--mute);padding:30px}
footer{text-align:center;color:var(--mute);font-size:13px;padding:20px}
</style>
</head>
<body>
<header>
  <div class="top"><span class="live"><i></i>מתעדכן</span><h1>מבזק טלגרם</h1></div>
  <p class="upd" id="upd"></p>
</header>
<main>
  <div class="tools">
    <input type="search" id="q" placeholder="חיפוש בהודעות…" aria-label="חיפוש">
    <div class="chips" id="chips"></div>
  </div>
  <ol id="feed"></ol>
</main>
<footer>האתר מתעדכן אוטומטית בערך כל רבע שעה. ההודעות מגיעות מערוצי טלגרם ציבוריים ולא תמיד מאומתות.</footer>
<script>
{
const D=__DATA__;
const esc=t=>String(t).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const names=Object.fromEntries(D.channels.map(c=>[c.u,c.n]));
const tf=new Intl.DateTimeFormat('he-IL',{timeZone:'Asia/Jerusalem',day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit'});
function ago(iso){const m=Math.round((Date.now()-new Date(iso))/60000);if(m<1)return'עכשיו';if(m<60)return'לפני '+m+' דק׳';if(m<1440)return'לפני '+Math.round(m/60)+' שע׳';return tf.format(new Date(iso))}
let ch='all';
document.getElementById('chips').innerHTML=[{u:'all',n:'הכול'}].concat(D.channels).map(c=>`<button class="chip" data-c="${esc(c.u)}" aria-pressed="${c.u==='all'}">${esc(c.n)}</button>`).join('');
function render(){
  const q=document.getElementById('q').value.trim().toLowerCase();
  const L=D.feed.filter(p=>(ch==='all'||p.c===ch)&&(!q||p.x.toLowerCase().includes(q))).slice(0,200);
  document.getElementById('feed').innerHTML=L.length?L.map(p=>`<li class="post"><div class="hd"><span class="ch">${esc(names[p.c]||p.c)}</span><time title="${esc(tf.format(new Date(p.t)))}">${ago(p.t)}</time></div>
  ${p.x?`<div class="tx">${esc(p.x)}</div>`:'<div class="md">הודעה עם תמונה או סרטון</div>'}
  <a class="go" href="https://t.me/${esc(p.id)}" target="_blank" rel="noopener">לפתיחה בטלגרם ←</a></li>`).join(''):'<li class="empty">אין הודעות להצגה.</li>';
  document.getElementById('upd').textContent='עודכן '+ago(D.updated)+' · '+tf.format(new Date(D.updated));
}
document.getElementById('chips').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;ch=b.dataset.c;document.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',x===b));render()});
document.getElementById('q').addEventListener('input',render);
render();
setInterval(render,60000);
setTimeout(()=>location.reload(),5*60000);
}
</script>
</body>
</html>
